name: gate

# The full quality gate. Auto-updating desktop installs only pull commits whose
# `gate` check passed (see sentinelseo/updater.py), so users never fetch a broken
# version even though pushes go straight to main.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install (Python)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Type-check (mypy)
        run: mypy src tests --exclude '\.venv' --follow-imports=skip

      - name: Tests (pytest)
        env:
          PYTHONPATH: src
        run: pytest tests/ -q

      - name: Build UI
        run: |
          npm --prefix ui ci
          npm --prefix ui run build
