[mypy]
python_version = 3.11
strict = True
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
# Off: several deps (fastapi, pywebview, google-auth-oauthlib, language_tool) are
# untyped or optional, so whether an ignore is "unused" flips between a full local
# venv and CI's clean install. Keeping this on made the gate pass locally but fail
# in CI — env-independent type-checking is worth this small relaxation.
warn_unused_ignores = False
warn_no_return = True
warn_unreachable = True
# Third-party libs without type stubs (or not installed in the type-check env)
# are treated as Any rather than erroring, so the gate is identical everywhere.
ignore_missing_imports = True

[mypy-conftest]
disallow_untyped_decorators = False
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-test_server]
disallow_untyped_decorators = False
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-test_fixes]
disallow_untyped_decorators = False
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-test_data_isolation]
disallow_untyped_decorators = False
disallow_untyped_defs = False
disallow_incomplete_defs = False


[mypy-test_edition_api]
disallow_untyped_decorators = False

[mypy-*.test_crawl_robustness]
disallow_untyped_decorators = False

[mypy-test_local_guard]
disallow_untyped_decorators = False

[mypy-test_fix_agent]
disallow_untyped_decorators = False

[mypy-test_edition]
disallow_untyped_decorators = False

[mypy-test_key_safety]
disallow_untyped_decorators = False

[mypy-test_ai_provider_errors]
disallow_untyped_decorators = False

[mypy-test_desktop]
disallow_untyped_decorators = False

[mypy-*.test_checks]
disallow_untyped_decorators = False
disallow_untyped_defs = False
disallow_incomplete_defs = False


# FastAPI / FastMCP route + tool decorators are untyped under follow_imports=skip,
# so mypy can't see through them. Relax only the decorator check for these two
# transport modules; every other strict check still applies.
[mypy-sentinelseo.web.api]
disallow_untyped_decorators = False

[mypy-sentinelseo.mcp.server]
disallow_untyped_decorators = False

